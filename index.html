<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Monthly Expenses Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>💰 Expense Tracker</h1>
            <p class="subtitle">Track your monthly spending</p>
        </header>

        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="card income">
                <div class="card-icon"><i class="fas fa-arrow-down"></i></div>
                <div class="card-content">
                    <h3>Income</h3>
                    <p id="totalIncome">₹0.00</p>
                </div>
            </div>
            <div class="card expense">
                <div class="card-icon"><i class="fas fa-arrow-up"></i></div>
                <div class="card-content">
                    <h3>Expenses</h3>
                    <p id="totalExpense">₹0.00</p>
                </div>
            </div>
            <div class="card balance">
                <div class="card-icon"><i class="fas fa-wallet"></i></div>
                <div class="card-content">
                    <h3>Balance</h3>
                    <p id="balance">₹0.00</p>
                </div>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <div class="form-container">
            <h2><i class="fas fa-plus-circle"></i> Add Transaction</h2>
            <form id="transactionForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Description</label>
                        <input type="text" id="description" placeholder="e.g., Salary, Groceries" required>
                    </div>
                    <div class="form-group">
                        <label>Amount (₹)</label>
                        <input type="number" id="amount" placeholder="0" step="0.01" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Type</label>
                        <select id="type" required>
                            <option value="income">Income</option>
                            <option value="expense">Expense</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="category" required>
                            <option value="food">🍔 Food</option>
                            <option value="vegetables">🥬 Vegetables</option>
                            <option value="provision">🛒 Provision</option>
                            <option value="transport">🚗 Transport</option>
                            <option value="petrol">⛽ Petrol</option>
                            <option value="hotel">🏨 Hotel</option>
                            <option value="shopping">🛍️ Shopping</option>
                            <option value="beauty">💄 Beauty</option>
                            <option value="bills">📄 Bills</option>
                            <option value="entertainment">🎬 Entertainment</option>
                            <option value="health">🏥 Health</option>
                            <option value="salary">💼 Salary</option>
                            <option value="investment">📈 Investment</option>
                            <option value="other">📦 Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fas fa-plus"></i> Add Transaction
                </button>
            </form>
        </div>

        <!-- Filter & Search -->
        <div class="filter-container">
            <input type="text" id="searchInput" placeholder="🔍 Search transactions...">
            <select id="filterMonth">
                <option value="all">All Months</option>
                <option value="current">Current Month</option>
                <option value="last">Last Month</option>
            </select>
            <button id="previewBtn" class="btn-preview">
                <i class="fas fa-calendar-alt"></i> Date Range Preview
            </button>
        </div>

        <!-- Date Range Modal -->
        <div id="dateRangeModal" class="modal hidden">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h3>📅 Select Date Range</h3>
                <div class="date-inputs">
                    <div class="form-group">
                        <label>From Date</label>
                        <input type="date" id="fromDate">
                    </div>
                    <div class="form-group">
                        <label>To Date</label>
                        <input type="date" id="toDate">
                    </div>
                </div>
                <button id="generatePreviewBtn" class="btn-submit">
                    <i class="fas fa-eye"></i> Generate Preview
                </button>
            </div>
        </div>

        <!-- Preview Result -->
        <div id="previewResult" class="preview-result hidden"></div>

        <!-- Transactions List (Two Columns) -->
        <div class="transactions-container">
            <h2><i class="fas fa-list"></i> Transactions</h2>
            <div class="columns-wrapper">
                <div class="column income-column">
                    <h3><i class="fas fa-arrow-down"></i> Income</h3>
                    <div id="incomeList" class="transaction-list"></div>
                    <div class="column-total">Total: <span id="incomeTotal">₹0.00</span></div>
                </div>
                <div class="column expense-column">
                    <h3><i class="fas fa-arrow-up"></i> Expenses</h3>
                    <div id="expenseList" class="transaction-list"></div>
                    <div class="column-total">Total: <span id="expenseTotal">₹0.00</span></div>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button id="exportCsvBtn" class="btn-action export-csv">
                <i class="fas fa-file-csv"></i> Export CSV
            </button>
            <button id="exportPdfBtn" class="btn-action export-pdf">
                <i class="fas fa-file-pdf"></i> Export PDF
            </button>
            <button id="saveBackupBtn" class="btn-action save-backup">
                <i class="fas fa-save"></i> Save Backup
            </button>
            <button id="loadBackupBtn" class="btn-action load-backup">
                <i class="fas fa-upload"></i> Load Backup
            </button>
            <button id="clearBtn" class="btn-action clear-all">
                <i class="fas fa-trash-alt"></i> Clear All
            </button>
        </div>

        <!-- Sync Status -->
        <div class="sync-status" id="syncStatus">
            <i class="fas fa-cloud"></i> <span id="syncText">Syncing...</span>
        </div>

        <!-- Footer -->
        <footer class="app-footer">
            Powered by @IAC
        </footer>
    </div>

    <!-- Edit Transaction Modal -->
    <div id="editModal" class="modal hidden">
        <div class="modal-content">
            <span class="close-edit-modal">&times;</span>
            <h3>✏️ Edit Transaction</h3>
            <form id="editForm">
                <input type="hidden" id="editId">
                
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="editDescription" required>
                </div>
                
                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input type="number" id="editAmount" step="0.01" required>
                </div>
                
                <div class="form-group">
                    <label>Type</label>
                    <select id="editType" required>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Category</label>
                    <select id="editCategory" required>
                        <option value="food">🍔 Food</option>
                        <option value="vegetables">🥬 Vegetables</option>
                        <option value="provision">🛒 Provision</option>
                        <option value="transport">🚗 Transport</option>
                        <option value="petrol">⛽ Petrol</option>
                        <option value="hotel">🏨 Hotel</option>
                        <option value="shopping">🛍️ Shopping</option>
                        <option value="beauty">💄 Beauty</option>
                        <option value="bills">📄 Bills</option>
                        <option value="entertainment">🎬 Entertainment</option>
                        <option value="health">🏥 Health</option>
                        <option value="salary">💼 Salary</option>
                        <option value="investment">📈 Investment</option>
                        <option value="other">📦 Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="editDate" required>
                </div>
                
                <!-- ✅ FIXED: Changed type="button" to type="submit" -->
                <button type="submit" id="saveEditBtn" class="btn-submit">
                    💾 Save Changes
                </button>
            </form>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="script.js"></script>
</body>
</html>
