<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💰 Monthly Expenses Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>💰 Expense Tracker</h1>
            <p class="subtitle">Track your monthly spending</p>
        </header>

        <!-- Summary Cards -->
        <div class="summary-cards">
            <div class="card income">
                <div class="card-icon">
                    <i class="fas fa-arrow-down"></i>
                </div>
                <div class="card-content">
                    <h3>Income</h3>
                    <p id="totalIncome">₹0.00</p>
                </div>
            </div>
            <div class="card expense">
                <div class="card-icon">
                    <i class="fas fa-arrow-up"></i>
                </div>
                <div class="card-content">
                    <h3>Expenses</h3>
                    <p id="totalExpense">₹0.00</p>
                </div>
            </div>
            <div class="card balance">
                <div class="card-icon">
                    <i class="fas fa-wallet"></i>
                </div>
                <div class="card-content">
                    <h3>Balance</h3>
                    <p id="balance">₹0.00</p>
                </div>
            </div>
        </div>

        <!-- Add Transaction Form -->
        <div class="form-container">
            <h2><i class="fas fa-plus-circle"></i> Add Transaction</h2>
            <form id="transactionForm">
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g., Salary, Groceries" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount (₹)</label>
                    <input type="number" id="amount" placeholder="0" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="type">Type</label>
                    <select id="type" required>
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="food">🍔 Food</option>
                        <option value="transport">🚗 Transport</option>
                        <option value="shopping">🛍️ Shopping</option>
                        <option value="bills">📄 Bills</option>
                        <option value="entertainment">🎬 Entertainment</option>
                        <option value="health">🏥 Health</option>
                        <option value="salary">💼 Salary</option>
                        <option value="investment">📈 Investment</option>
                        <option value="other">📦 Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fas fa-plus"></i> Add Transaction
                </button>
            </form>
        </div>

        <!-- Filter & Search -->
        <div class="filter-container">
            <input type="text" id="searchInput" placeholder="🔍 Search transactions...">
            <select id="filterMonth">
                <option value="all">All Months</option>
                <option value="current">Current Month</option>
                <option value="last">Last Month</option>
            </select>
        </div>

        <!-- Transactions List -->
        <div class="transactions-container">
            <h2><i class="fas fa-list"></i> Transactions</h2>
            <div id="transactionsList" class="transactions-list">
                <!-- Transactions will be added here -->
            </div>
        </div>

        <!-- Export Data -->
        <div class="export-section">
            <button id="exportBtn" class="btn-export">
                <i class="fas fa-download"></i> Export Data (CSV)
            </button>
            <button id="clearBtn" class="btn-clear">
                <i class="fas fa-trash"></i> Clear All Data
            </button>
        </div>

        <!-- Sync Status -->
        <div class="sync-status" id="syncStatus">
            <i class="fas fa-cloud"></i> <span id="syncText">Syncing...</span>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Firebase Config (YOU NEED TO UPDATE THIS) -->
    <script src="firebase-config.js"></script>
    
    <!-- Main Script -->
    <script src="script.js"></script>
</body>
</html>
